<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <!-- crs passes the EPSG:\d+ regex but no such code exists, so
         fromEPSGCode rejects and the render step must fail. -->
    <pre id="map">
use: Openlayers
width: 400px
height: 300px
center: [121, 24]
zoom: 8
crs: EPSG:999999
    </pre>
    <script type="module" src="/dist/mapclay.mjs?target=%23map"></script>
  </body>
</html>
