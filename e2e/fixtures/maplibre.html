<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Resolve mapclay.js and its ./renderers/*.mjs aliases under /dist/ -->
    <base href="/dist/" />
  </head>
  <body>
    <pre id="map">
use: Maplibre
width: 400px
height: 300px
center: [121, 24]
zoom: 8
# Inline empty style keeps the happy-path render offline/deterministic
# (the default style is fetched from a remote URL).
style:
  version: 8
  sources: {}
  layers: []
    </pre>
    <script src="mapclay.js" data-target="#map"></script>
  </body>
</html>
